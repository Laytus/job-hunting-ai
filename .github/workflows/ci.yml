name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: job_hunting_ai
          POSTGRES_USER: job_hunting_ai
          POSTGRES_PASSWORD: job_hunting_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U job_hunting_ai -d job_hunting_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://job_hunting_ai:job_hunting_ai@localhost:5432/job_hunting_ai
      DATABASE_TEST_URL: postgresql://job_hunting_ai:job_hunting_ai@localhost:5432/job_hunting_ai_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Database integration tests
        run: pnpm test:db
